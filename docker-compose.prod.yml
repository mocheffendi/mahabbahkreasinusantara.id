# docker-compose.prod.yml
# Compose untuk server: hanya menjalankan image (tanpa build, tanpa registry).
# Nama image dapat di-override lewat environment, mis.:
#   IMAGE_REF=mahabbahkreasinusantara:20260101 docker compose up -d
services:
  web:
    image: ${IMAGE_REF:-mahabbahkreasinusantara:latest}
    container_name: mahabbahkreasinusantara
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
